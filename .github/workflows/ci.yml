name: CI

# Runs the automated test suite (Task C) on every push and pull request,
# so a broken build is caught immediately rather than discovered later -
# this is the "workflow (CI/CD) demonstrated" evidence for Task D.
on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Compile
        run: mvn -B compile

      - name: Run unit tests (JUnit 5, in-memory fake DAOs - no database needed)
        run: mvn -B test

      - name: Package
        run: mvn -B package -DskipTests

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: appointment-system-jar
          path: target/appointment-system-jar-with-dependencies.jar
